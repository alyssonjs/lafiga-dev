version: '3.9'

services:
  database:
    image: postgres:17
    container_name: lafiga_db
    restart: unless-stopped
    volumes:
      - ./tmp/db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: lafiga_api
      POSTGRES_PASSWORD: password
      POSTGRES_DB: lafiga-api_db_1
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: lafiga_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    image: lafiga/api-develop:latest
    container_name: lafiga_api
    restart: unless-stopped
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails s -p 3001 -b '0.0.0.0'"
    working_dir: /lafiga-api
    volumes:
      - ../api:/lafiga-api
      - ./api/bundler_gems:/usr/local/bundle
      - ../api/translate-key.json:/lafiga-api/translate-key.json:ro
    ports:
      - "3001:3001"
    depends_on:
      - database
      - redis
    environment:
      RAILS_ENV: development
      JWT_SECRET: changeme-dev-secret
      GOOGLE_APPLICATION_CREDENTIALS: /lafiga-api/translate-key.json
      REDIS_URL: redis://redis:6379/1
      # Opcional: reset de senha pelo mestre em /dm/users (POST …/dm_users/:id/reset_password)
      DM_PASSWORD_RESET_DEFAULT: ${DM_PASSWORD_RESET_DEFAULT:-TempDmResetDev99}
      # Web Push (VAPID) — chaves de DEV (prod usa deploy/.env.production com chaves próprias)
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-BPni9bfNI9z9SOQVCaCwYWMCzvgYnd-CynqR2imRQuQl876U5BGtY0srp5e8VDGk5lz2_JNLghCFjgrk7DcIuY4=}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-c6r1j0K0VlogNRMiZtb2tBbHY6dV2Blu3_8yYqcBgWU=}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:dev@lafiga.com.br}

  # O relógio do mundo (L0.5): o laço que avança as vilas a cada 15 s (`bin/rails mundo:relogio`). A mesma imagem e o
  # mesmo código montado da api; o código novo entra a cada ronda (o reloader do Rails). Para parar e subir:
  # `docker compose stop relogio` / `docker compose start relogio`; o log: `docker logs -f lafiga_relogio`.
  relogio:
    image: lafiga/api-develop:latest
    container_name: lafiga_relogio
    restart: unless-stopped
    command: bundle exec rails mundo:relogio
    working_dir: /lafiga-api
    volumes:
      - ../api:/lafiga-api
      - ./api/bundler_gems:/usr/local/bundle
    depends_on:
      - database
      - redis
      - api
    environment:
      RAILS_ENV: development
      JWT_SECRET: changeme-dev-secret
      REDIS_URL: redis://redis:6379/1
    stop_grace_period: 20s

  # SPA Vite (Vite) — http://localhost:5173
  # Monta `../front-lafiga` (monorepo). O submodule `../lafiga-web` aponta para o
  # mesmo repositório remoto; se montares a pasta errada, o container não vê
  # o código que estás a editar em front-lafiga.
  front:
    image: node:20
    container_name: lafiga_front
    restart: unless-stopped
    tty: true
    working_dir: /app
    command: sh -c "npm ci || npm install && npm run dev"
    volumes:
      - ../front-lafiga:/app
      - front_lafiga_node_modules:/app/node_modules
      # Mount read-only de `api/config/` para que specs cross-platform
      # (vitest BDD) leiam o canônico backend (skills.yml etc.) sem copiar.
      - ../api/config:/api-canonical:ro
    ports:
      - "5173:5173"
    environment:
      NODE_ENV: development
      # Chamadas à API partem do browser → usar host da máquina (não o nome do serviço Docker)
      VITE_API_BASE_URL: http://localhost:3001
      # Session feed (chat + dados) via ActionCable SessionFeedChannel — mesmo /cable que mapa/combate
      VITE_SESSION_FEED_CABLE: "true"
      VITE_USE_MOCK_DATA: "false"
      VITE_DEFAULT_PLAYER_ROLE_ID: "12"
    depends_on:
      - api

volumes:
  front_lafiga_node_modules:
